<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultra Login UI</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- CARD -->
<div class="card">
  <h2>Login</h2>

  <form id="loginForm">
    <div class="input-box">
      <input type="email" required id="email">
      <label>Email</label>
    </div>

    <div class="input-box">
      <input type="password" required id="password">
      <label>Password</label>
    </div>

    <button type="submit">Sign In</button>

    <div class="links">
      <a href="#">Forgot?</a>
      <a href="#">Remember</a>
    </div>
  </form>

  <div class="signup">
    No account? <a href="#">Register</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
